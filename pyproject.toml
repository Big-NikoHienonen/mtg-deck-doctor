[project]
name = "mtg-deck-doctor"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Niko Hienonen", email = "niko.hienonen@futurice.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mtg-deck-doctor = "mtg_deck_doctor:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
